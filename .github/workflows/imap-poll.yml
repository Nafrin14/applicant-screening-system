name: Poll Candidate Email Replies

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min — reliable. Loop inside covers the gaps.
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6        # safety cap — kill if something hangs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install poller dependencies
        working-directory: scripts
        run: npm install

      - name: Poll mailbox every ~60s for 5 minutes
        working-directory: scripts
        # Runs 5 polls spaced 60 seconds apart inside one job.
        # Each cron trigger is every 5 min → combined effective interval ~60s.
        # message_id upsert ensures no duplicates even if two runs overlap.
        run: |
          for i in 1 2 3 4 5; do
            echo "--- Poll $i of 5 ---"
            node pollMail.js --once
            if [ $i -lt 5 ]; then sleep 60; fi
          done
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
